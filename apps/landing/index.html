<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vorynth — a local-first personal intelligence engine. Collect, rank, and understand the stories that matter from the sources you trust — all on your machine."
    />
    <meta name="theme-color" id="theme-color" content="#0E1513" />
    <meta name="color-scheme" content="dark light" />
    <title>Vorynth — Personal Intelligence Engine</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-192.png" sizes="192x192" />
    <link rel="icon" href="%BASE_URL%logo-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="%BASE_URL%logo-512.png" sizes="512x512" type="image/png" />

    <!-- Google Fonts: Newsreader (headlines), Geist (body/labels), Inter (fallback).
         Material Symbols (icons) is self-hosted via @fontsource so icons render
         where Google is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Newsreader:opsz,wght@6..72,500..800&family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved/system theme before first paint (no flash). -->
    <script>
      (function () {
        var key = "vorynth-theme";
        var saved;
        try {
          saved = localStorage.getItem(key);
        } catch (_) {}
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        var html = document.documentElement;
        html.classList.toggle("dark", theme === "dark");
        var meta = document.getElementById("theme-color");
        if (meta) meta.content = theme === "dark" ? "#0E1513" : "#F8FAFA";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
