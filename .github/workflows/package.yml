name: Package

# Produces signed-ish desktop installers for Windows, macOS (Intel + Apple
# Silicon), Linux (x86_64 + ARM64), and FreeBSD from the bundled core-engine
# sidecar + Tauri shell.
#
# Pipeline per target (fail-fast at each stage):
#   1. Install pnpm + Node 22 + Rust toolchain.
#   2. Install workspace deps; rebuild better-sqlite3 for THIS platform.
#   3. Lint: typecheck → lint (fast feedback — stops here on failure)
#   4. Build: frontend → bundle sidecar
#   5. Release: stage sidecar → cargo tauri build → upload artifacts
#
# NOTE on "no Node install required" (project-details.md §15): in dev mode
# the Tauri shell falls back to `pnpm dev`. For the packaged app, the CI
# bundles a portable Node.js binary alongside the sidecar bundle (see the
# "Embed portable Node.js" step) so users never need to install Node.
#
# BSD Family note: Linux x86_64 binaries run on FreeBSD via the Linux ABI
# compatibility layer (linuxulator). Native FreeBSD builds are also provided
# using the FreeBSD VM runner for users who prefer native binaries.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - "LICENSE"
  workflow_dispatch:

# Required for the tauri-action to create GitHub releases
permissions:
  contents: write

jobs:
  # ── Stage 1: security ──────────────────────────────────────────────────────
  # Semgrep static analysis runs FIRST — packaging must not start until the
  # security scan is clean (free community ruleset + the repo's custom
  # plugin-bundle rules). No SEMGREP_APP_TOKEN needed on public repos.
  # Runs inside the official `semgrep/semgrep` docker image. The old
  # `semgrep/semgrep-action@v2` was archived upstream (no `v2` tag exists), so
  # `semgrep scan` on the image's CLI is the maintained replacement — NOT
  # `semgrep ci`, which requires an AppSec Platform token and ignores
  # `--config` (rules come from the org instead).
  security:
    name: Semgrep · Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned, immutable version tag — `latest` is a moving target (and can lag
      # the newest release); a versioned image keeps the gate reproducible.
      image: semgrep/semgrep:1.172.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep/plugin-bundles.yml \
            --metrics off

  # ── Stage 2: tests + lint + build ──────────────────────────────────────────
  # Full verification gate. Packaging (below) waits on both this and security.
  verify:
    name: Tests · Lint · Build
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native (better-sqlite3)
        run: pnpm rebuild better-sqlite3

      # Version files must stay in sync — catches drift early.
      - name: Version check
        run: pnpm version:check

      # @vorynth/types needs its dist/ emitted before dependent packages
      # can resolve it via exports.
      - name: Build shared types
        run: pnpm --filter @vorynth/types build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  package:
    # Security scan + tests/lint/build must pass before any installer is built.
    needs: [security, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS ────────────────────────────────────────────────────────
          # Intel is cross-compiled on an Apple Silicon runner (macos-14) —
          # the macos-13 Intel runners are slow and flaky. node_arch: x64 makes
          # setup-node + pnpm rebuild (better-sqlite3) + the embedded portable
          # node all produce x86_64 artifacts; Rust cross-compiles natively.
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            artifact: vorynth-macos-arm64
            use-cross: false
            is-harmonyos: false
            node_arch: ""
          - os: macos-14
            target: x86_64-apple-darwin
            label: macOS (Intel — cross-compiled on Apple Silicon)
            artifact: vorynth-macos-x64
            use-cross: false
            is-harmonyos: false
            node_arch: x64

          # ── Linux ─────────────────────────────────────────────────────────
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
            artifact: vorynth-linux-x64
            use-cross: false
            is-harmonyos: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux ARM64
            artifact: vorynth-linux-arm64
            use-cross: false
            is-harmonyos: false

          # ── Windows ──────────────────────────────────────────────────────
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows
            artifact: vorynth-windows-x64
            use-cross: false
            is-harmonyos: false

          # ── Windows ARM64 ───────────────────────────────────────────────
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows ARM64
            artifact: vorynth-windows-arm64
            use-cross: false
            is-harmonyos: false

          # ── HarmonyOS / OpenHarmony ──────────────────────────────────────
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-ohos
            label: HarmonyOS NEXT (ARM64)
            artifact: vorynth-harmonyos-arm64
            use-cross: false
            is-harmonyos: true

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # macOS Intel is cross-compiled on an arm64 runner — pin the x64 node
          # build so native rebuilds (better-sqlite3) and the embedded portable
          # node match the x86_64 target. Empty on every other job = host arch.
          architecture: ${{ matrix.node_arch }}
          cache: pnpm

      - name: Setup Rust
        if: matrix.is-harmonyos == false
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # HarmonyOS needs a custom toolchain setup (OHOS NDK + Rust target).
      # The NDK provides the clang cross-compiler and OHOS sysroot needed
      # by Rust's aarch64-unknown-linux-ohos target.
      - name: Cache OHOS NDK
        id: cache-ohos
        if: matrix.is-harmonyos == true
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/ohos-sdk
          key: ohos-sdk-6.0-Release

      - name: Setup Rust & NDK for HarmonyOS
        if: matrix.is-harmonyos == true
        run: |
          rustup target add aarch64-unknown-linux-ohos || \
            rustup target add aarch64-unknown-linux-gnu

          # Download & extract the OHOS SDK if cache missed.
          # The SDK is ~2.3 GiB; caching avoids re-download on subsequent runs.
          if [ ! -d "$HOME/ohos-sdk/linux/native/llvm/bin" ]; then
            echo "Downloading OpenHarmony SDK (~2.3 GiB, may take a while)..."
            mkdir -p "$HOME/ohos-sdk"
            sudo apt-get install -y -qq unzip
            curl -L -o /tmp/ohos-sdk.tar.gz \
              "https://repo.huaweicloud.com/openharmony/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz"
            tar -xzf /tmp/ohos-sdk.tar.gz -C "$HOME/ohos-sdk"
            rm /tmp/ohos-sdk.tar.gz

            # The tarball bundles per-platform zips. Extract the Linux native NDK.
            NATIVE_ZIP="$(ls "$HOME/ohos-sdk/linux"/native-linux-x64-*.zip 2>/dev/null | head -1)"
            if [ -n "$NATIVE_ZIP" ]; then
              unzip -q "$NATIVE_ZIP" -d "$HOME/ohos-sdk/linux/"
              rm "$NATIVE_ZIP"
            fi
          fi

          # Create clang wrapper — the Rust linker expects a compiler named
          # "aarch64-unknown-linux-ohos-clang" on PATH. The wrapper injects the
          # target triple, sysroot, and the -D__MUSL__ flag the OHOS C runtime
          # requires.
          mkdir -p "$HOME/.cargo/bin"
          cat > "$HOME/.cargo/bin/aarch64-unknown-linux-ohos-clang" << EOF
          #!/bin/sh
          exec $HOME/ohos-sdk/linux/native/llvm/bin/clang \
            -target aarch64-linux-ohos \
            --sysroot=$HOME/ohos-sdk/linux/native/sysroot \
            -D__MUSL__ \
            "\$@"
          EOF
          chmod +x "$HOME/.cargo/bin/aarch64-unknown-linux-ohos-clang"

          echo "OHOS_NDK_HOME=$HOME/ohos-sdk/linux/native" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/ohos-sdk/linux/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu') && matrix.is-harmonyos == false
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native (better-sqlite3) for this platform
        if: matrix.is-harmonyos == false
        run: pnpm rebuild better-sqlite3

      # @vorynth/types needs its dist/ emitted before dependent packages
      # can resolve it via exports.
      - name: Build shared types
        run: pnpm --filter @vorynth/types build

      # ── Lint ────────────────────────────────────────────────────────────────
      # Stage 1: code quality. If this fails, nothing else runs.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ── Build ───────────────────────────────────────────────────────────────
      # Stage 2: compile. If this fails, no release is produced.
      - name: Build frontend
        run: pnpm --filter @vorynth/desktop build

      - name: Bundle core engine sidecar
        run: pnpm --filter @vorynth/core-engine bundle

      # ── Embed portable Node.js ──────────────────────────────────────────────────
      # Copy the Node.js binary from the CI runner into the sidecar bundle so the
      # shipped app works without Node.js installed on the user's machine.
      # The Rust sidecar spawner (main.rs) checks for a bundled `node`/`node.exe`
      # in the sidecar directory before falling back to the system PATH.
      - name: Embed portable Node.js
        if: matrix.is-harmonyos == false
        shell: bash
        run: |
          NODE_BIN="$(command -v node)"
          # Resolve symlinks — setup-node uses version managers (nvm, fnm, etc.)
          # which place shims rather than the real binary on PATH.
          if command -v realpath &>/dev/null; then
            NODE_BIN="$(realpath "$NODE_BIN")"
          elif command -v readlink &>/dev/null; then
            NODE_BIN="$(readlink -f "$NODE_BIN")"
          fi
          echo "Bundling Node.js from: $NODE_BIN"
          case "${{ matrix.target }}" in
            *windows*|*-msvc*)
              cp "$NODE_BIN" apps/core-engine/dist-bundle/node.exe
              chmod +x apps/core-engine/dist-bundle/node.exe
              echo "Placed as node.exe ($(wc -c < apps/core-engine/dist-bundle/node.exe) bytes)"
              ;;
            *)
              cp "$NODE_BIN" apps/core-engine/dist-bundle/node
              chmod +x apps/core-engine/dist-bundle/node
              echo "Placed as node ($(wc -c < apps/core-engine/dist-bundle/node) bytes)"
              ;;
          esac

      # ── Release (Tauri desktop builds) ─────────────────────────────────────────
      # Stage 3a: produce native installers for standard desktop platforms.
      - name: Stage sidecar for Tauri
        if: matrix.is-harmonyos == false
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp -r apps/core-engine/dist-bundle \
            apps/desktop/src-tauri/binaries/vorynth-core-${{ matrix.target }}
          ls -la apps/desktop/src-tauri/binaries/

      - name: Build Tauri app
        if: matrix.is-harmonyos == false
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (v1.8.0): when present, tauri-cli signs every bundle
          # (`.sig` files) and tauri-action merges them into latest.json — the
          # manifest the in-app updater reads. Store the private key (contents
          # of apps/desktop/src-tauri/.tauri/vorynth.key, password empty) as a
          # GitHub secret of this name.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Vorynth ${{ github.ref_name }}"
          releaseBody: "See the assets below to download this version."
          releaseDraft: true
          prerelease: false
          overwrite: true
          # NSIS (setup.exe) over WiX (msi) for Windows updates: NSIS supports
          # per-user installs without admin elevation, so self-update works
          # for every user, not just admins.
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

      # ── Smoke tests (desktop builds) ──────────────────────────────────────────
      # Stage 3a verification: the packaged app's shell must find and spawn its
      # bundled engine. A regression here (v1.8.0 shipped with the engine
      # unreachable because the shell searched the wrong resource dir) silently
      # cripples every packaged build. Each OS launches its real packaged
      # artifact and waits for GET /health. (HarmonyOS is a raw bundle, not a
      # runnable package — skipped.)
      - name: Smoke test — Linux AppImage engine /health
        if: startsWith(matrix.os, 'ubuntu') && matrix.is-harmonyos == false
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb >/dev/null
          APPIMAGE="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' | head -1)"
          test -n "$APPIMAGE" || { echo "no AppImage produced"; exit 1; }
          echo "Smoke-testing: $APPIMAGE"
          cd "$(dirname "$APPIMAGE")"
          BASE="$(basename "$APPIMAGE")"
          chmod +x "$BASE"
          # APPIMAGE_EXTRACT_AND_RUN: GitHub runners have no FUSE. The shell
          # probes ports upward from 34117; on a clean runner 34117 is free.
          APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            xvfb-run -a "./$BASE" >/tmp/vorynth-smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:34117/health >/dev/null 2>&1; then
              echo "ENGINE_HEALTH_OK after ${i}s"
              OK=1
              break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "Engine never became healthy. Log tail:"
            tail -40 /tmp/vorynth-smoke.log
            exit 1
          fi

      - name: Smoke test — macOS .app engine /health
        if: startsWith(matrix.os, 'macos') && matrix.is-harmonyos == false
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          BIN="$APP/Contents/MacOS/vorynth-desktop"
          test -x "$BIN" || { echo "binary missing: $BIN"; exit 1; }
          echo "Smoke-testing: $BIN"
          "$BIN" >/tmp/vorynth-smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:34117/health >/dev/null 2>&1; then
              echo "ENGINE_HEALTH_OK after ${i}s"
              OK=1
              break
            fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "Engine never became healthy. Log tail:"
            tail -40 /tmp/vorynth-smoke.log
            exit 1
          fi

      - name: Smoke test — Windows installer engine /health
        if: startsWith(matrix.os, 'windows') && matrix.is-harmonyos == false
        shell: bash
        run: |
          set -euo pipefail
          SETUP="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -name '*-setup.exe' | head -1)"
          test -n "$SETUP" || { echo "no NSIS setup found"; exit 1; }
          echo "Installing: $SETUP"
          # MSYS_NO_PATHCONV stops Git Bash from mangling /S and /D= into paths.
          MSYS_NO_PATHCONV=1 "$SETUP" /S "/D=C:\\vorynth-smoke"
          INSTALLED="$(find "C:/vorynth-smoke" -maxdepth 1 -name '*.exe' 2>/dev/null | head -1)"
          test -n "$INSTALLED" || { echo "installed exe not found"; exit 1; }
          echo "Smoke-testing: $INSTALLED"
          "$INSTALLED" >/tmp/vorynth-smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:34117/health >/dev/null 2>&1; then
              echo "ENGINE_HEALTH_OK after ${i}s"
              OK=1
              break
            fi
            sleep 1
          done
          taskkill //F //PID "$APP_PID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "Engine never became healthy. Log tail:"
            tail -40 /tmp/vorynth-smoke.log
            exit 1
          fi

      # ── Release (HarmonyOS build) ─────────────────────────────────────────────
      # Stage 3b: cross-compile the Rust shell as a shared library and package it
      # with the frontend assets into a raw bundle for DevEco Studio import.
      - name: Compile Rust library for HarmonyOS
        if: matrix.is-harmonyos == true
        env:
          CC: aarch64-unknown-linux-ohos-clang
          AR: llvm-ar
        run: |
          cd apps/desktop/src-tauri
          cargo build --release --target=aarch64-unknown-linux-ohos --lib

      - name: Assemble HarmonyOS app template
        if: matrix.is-harmonyos == true
        run: |
          mkdir -p harmonyos-output/entry/src/main/resources/rawfile
          mkdir -p harmonyos-output/entry/libs/arm64-v8a

          # 1. Inject compiled frontend assets
          cp -r apps/desktop/dist/* harmonyos-output/entry/src/main/resources/rawfile/

          # 2. Inject compiled Rust shared library
          cp apps/desktop/src-tauri/target/aarch64-unknown-linux-ohos/release/libvorynth_desktop.so \
            harmonyos-output/entry/libs/arm64-v8a/

          # 3. Compress to artifact archive
          tar -czf vorynth-harmonyos-raw-bundle.tar.gz harmonyos-output/

      # ── Upload ─────────────────────────────────────────────────────────────────
      - name: Upload desktop artifacts
        if: matrix.is-harmonyos == false
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.xz
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HarmonyOS bundle
        if: matrix.is-harmonyos == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: vorynth-harmonyos-raw-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

      # upload-artifact only lands in the workflow run's Artifacts section —
      # attach the bundle to the GitHub release draft as well, next to the
      # installers tauri-action uploads. The action finds the existing draft
      # for this tag (created by tauri-action) or creates it if this job
      # finishes first.
      - name: Attach HarmonyOS bundle to release
        if: matrix.is-harmonyos == true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vorynth ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: vorynth-harmonyos-raw-bundle.tar.gz

  # ── FreeBSD (native) ─────────────────────────────────────────────────────
  # Built inside a FreeBSD VM on an Ubuntu runner. Tauri on FreeBSD uses the
  # native FreeBSD WebKit port. This is experimental — if the build fails, the
  # Linux x86_64 binary is the recommended fallback (works via Linux ABI).
  freebsd:
    name: FreeBSD x86_64
    # Gated like the rest of packaging: semgrep + tests/lint/build first.
    needs: [security, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: true
          prepare: |
            # Switch to latest repo (quarterly doesn't have the needed
            # webkit2-gtk version in latest).
            # FreeBSD 15 renamed the official repo from "FreeBSD" to "FreeBSD-ports"
            # and pkg+http:// requires mirror_type: "srv".
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: {
              url: "pkg+http://pkg.FreeBSD.org/${ABI}/latest",
              mirror_type: "srv",
              enabled: yes
            }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            pkg install -y node npm python3 rust pkgconf
            # List available webkit packages so we know what's available
            pkg search webkit2 || true
            # Install webkit — Tauri v2 needs webkit2gtk-4.1.
            # On FreeBSD this package is called webkit2-gtk_41.
            pkg install -y gtk3 librsvg2 libxcb
            pkg install -y webkit2-gtk_41

          run: |
            # pnpm is not available on FreeBSD pkg, use npm to install it
            npm install -g pnpm@10
            pnpm install --frozen-lockfile
            pnpm rebuild better-sqlite3

            # Build shared types first (needed by core-engine typecheck)
            pnpm --filter @vorynth/types build

            # Lint
            pnpm typecheck
            pnpm lint

            # Build
            pnpm --filter @vorynth/desktop build
            pnpm --filter @vorynth/core-engine bundle

            # Embed portable Node.js so FreeBSD users don't need it installed
            cp "$(command -v node)" apps/core-engine/dist-bundle/node
            chmod +x apps/core-engine/dist-bundle/node

            # Release
            mkdir -p apps/desktop/src-tauri/binaries
            cp -r apps/core-engine/dist-bundle \
              apps/desktop/src-tauri/binaries/vorynth-core-x86_64-unknown-freebsd

            # NOTE: tauri-cli can never be installed on FreeBSD — it depends
            # on cargo-mobile2, which hard-fails with compile_error! on
            # unsupported hosts (FreeBSD included) and is NOT behind a
            # feature flag. Build with plain cargo instead: the frontend is
            # embedded at compile time via tauri::generate_context!(), and
            # the sidecar ships as a plain directory next to the binary
            # (main.rs searches `binaries/` relative to the executable).
            cargo build --release --target x86_64-unknown-freebsd \
              --manifest-path apps/desktop/src-tauri/Cargo.toml

            # Package: binary + sidecar in one tarball.
            mkdir -p freebsd-output/binaries
            cp apps/desktop/src-tauri/target/x86_64-unknown-freebsd/release/vorynth-desktop \
              freebsd-output/
            cp -r apps/desktop/src-tauri/binaries/vorynth-core-x86_64-unknown-freebsd \
              freebsd-output/binaries/
            tar -czf vorynth-freebsd-x64.tar.gz -C freebsd-output .

      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vorynth-freebsd-x64
          path: vorynth-freebsd-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach FreeBSD tarball to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vorynth ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: vorynth-freebsd-x64.tar.gz
