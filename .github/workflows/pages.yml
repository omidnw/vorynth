name: Pages

# Builds the Vorynth landing page (apps/landing) and deploys it to GitHub Pages.
#
# The site serves as the project homepage at:
#   https://omidnw.github.io/vorynth/
#
# Content: the Vite-built landing page (hero, real app mockup, features,
# architecture, platforms) + the README as a quick-reference page. The built
# assets are copies of apps/landing/public (favicon, logos) + dist.
#
# Requirements:
#   1. GitHub Pages must be enabled in the repo settings → "Deploy from a
#      branch" or "GitHub Actions" as the source. The latter is recommended.
#   2. The Pages workflow requires the `pages` and `id-token` permissions below.

on:
  push:
    branches: [master]
    paths:
      - "apps/landing/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as
# we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Pinned to 24.18.1 — 24.19.0 is a regression (nodejs/node#63642
          # backport) that aborts Node on GC (`Assertion failed: (env) !=
          # nullptr`); 24.19.1 with the fix hasn't shipped.
          node-version: 24.18.1
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Install
        run: pnpm install --frozen-lockfile

      # @vorynth/types needs its dist/ emitted before dependent packages
      # can resolve it via exports.
      - name: Build shared types
        run: pnpm --filter @vorynth/types build

      - name: Build landing page
        run: pnpm --filter @vorynth/landing build
        env:
          # Use the Pages base path so asset URLs are correct
          VITE_BASE_URL: /vorynth/

      - name: Prepare Pages artifact
        shell: bash
        run: |
          # The landing app's dist is the site root.
          mkdir -p _site
          cp -a apps/landing/dist/* _site/

          # Copy the README as a quick-reference page.
          cp README.md _site/README.md 2>/dev/null || true

          echo "Pages artifact contents:"
          ls -la _site/
          find _site -type f | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
