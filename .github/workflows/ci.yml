name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - "LICENSE"

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native addon
        run: pnpm rebuild better-sqlite3

      # Version files must stay in sync — catches drift early.
      - name: Version check
        run: pnpm version:check

      # @vorynth/types needs its dist/ emitted before dependent packages
      # can resolve it via exports.
      - name: Build shared types
        run: pnpm --filter @vorynth/types build

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm build

  # ── Security ──────────────────────────────────────────────────────────────
  # Static analysis with Semgrep (free community ruleset + the repo's custom
  # plugin-bundle rules). Runs in parallel with verify; the release pipeline
  # gates packaging on this job too (see package.yml).
  semgrep:
    name: Semgrep · Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned, immutable version tag — `latest` is a moving target (and can lag
      # the newest release); a versioned image keeps the gate reproducible.
      image: semgrep/semgrep:1.172.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the open-source semgrep CLI in local mode on public repos — no
      # SEMGREP_APP_TOKEN required. Uses `semgrep scan` (not `semgrep ci`,
      # which needs an AppSec Platform token) inside the official image; the
      # old `semgrep/semgrep-action@v2` was archived upstream (no v2 tag).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep/plugin-bundles.yml \
            --metrics off
