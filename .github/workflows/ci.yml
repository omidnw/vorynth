name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - "LICENSE"

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native addon
        run: pnpm rebuild better-sqlite3

      # Version files must stay in sync — catches drift early.
      - name: Version check
        run: pnpm version:check

      # @vorynth/types and @vorynth/ui need their dist/ emitted before
      # dependent packages can resolve them via exports. Building ui here (not
      # just types) also removes the pretest race between desktop and landing,
      # which both build ui in parallel during `pnpm -r run test`.
      - name: Build shared packages
        run: pnpm --filter @vorynth/types build && pnpm --filter @vorynth/ui build

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm build

  # ── Security ──────────────────────────────────────────────────────────────
  # Static analysis with Semgrep (free community ruleset + the repo's custom
  # plugin-bundle rules). Runs in parallel with verify; the release pipeline
  # gates packaging on this job too (see package.yml).
  semgrep:
    name: Semgrep · Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned, immutable version tag — `latest` is a moving target (and can lag
      # the newest release); a versioned image keeps the gate reproducible.
      image: semgrep/semgrep:1.172.0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Runs the open-source semgrep CLI in local mode on public repos — no
      # SEMGREP_APP_TOKEN required. Uses `semgrep scan` (not `semgrep ci`,
      # which needs an AppSec Platform token) inside the official image; the
      # old `semgrep/semgrep-action@v2` was archived upstream (no v2 tag).
      # `--config p/default` is the community ruleset that `--config auto`
      # resolves to for a public repo — spelled out explicitly so `--metrics
      # off` works (auto + metrics off are incompatible upstream). `--error`
      # turns any finding into a hard failure; verified false positives are
      # annotated inline with `# nosemgrep:` reasons (see the 14 known ones in
      # adapters, media, crypto, plugin-loader, SourcesPage, story-renderer).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config .semgrep/plugin-bundles.yml \
            --metrics off \
            --error
