name: Connector health

# Nightly canary: proves every cataloged source adapter (RSS, GitHub releases,
# arXiv, HTML crawler, Sitemap, JSON API) still collects against the real
# internet. A connector that silently returns "no new articles" — the classic
# adapter rot — fails this job loudly instead of hiding forever.
#
# Services that sell their API are intentionally absent (see
# apps/core-engine/src/health/reference-sources.ts + connector-policy.md):
# Vorynth ships no adapter for them, so nothing probes them by design.
#
# MANUAL ONLY: there is no schedule — this runs solely when the user clicks
# "Run workflow" (workflow_dispatch). It never gates releases (package.yml is
# untouched); it is the on-demand watchdog.

on:
  workflow_dispatch:

jobs:
  check:
    name: Collect against reference sources
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Pinned to 24.18.1 — 24.19.0 is a regression (nodejs/node#63642
          # backport) that aborts Node on GC (`Assertion failed: (env) !=
          # nullptr`); 24.19.1 with the fix hasn't shipped.
          node-version: 24.18.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native addon
        run: pnpm rebuild better-sqlite3

      # The health script imports the compiled adapters from dist/, so the
      # shared types + engine must be built first (same order as ci.yml).
      - name: Build shared types
        run: pnpm --filter @vorynth/types build

      - name: Build engine
        run: pnpm --filter @vorynth/core-engine build

      - name: Run connector health check
        run: node apps/core-engine/scripts/connector-health.mjs
